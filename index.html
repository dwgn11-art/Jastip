<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Jastipper Pro V9</title>
  <link rel="icon" type="image/png" href="/jastipper-logo.png">
  <link rel="apple-touch-icon" href="/jastipper-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          brand: { 50:'#f8fafc',100:'#f1f5f9',500:'#64748b',900:'#0f172a' },
          accent: { 500:'#3b82f6',600:'#2563eb' }
        },
        fontFamily: { sans:['Inter','sans-serif'] }
      }}
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <style>
    :root { color-scheme: light; --nav-h: 66px; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#f8fafc; }
    body { font-family:'Inter',sans-serif; color:#0f172a; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
    button,input,select,textarea { font:inherit; }
    button { touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    .tabular-nums { font-variant-numeric:tabular-nums; }
    .tap-target { min-width:40px; min-height:40px; }
    .compact-card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; }
    .soft-shadow { box-shadow:0 3px 14px -8px rgba(15,23,42,.25); }
    .fade-in { animation:fadeIn .18s ease-out both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
    .safe-bottom { padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); }
    .modal-sheet { max-height:min(90vh, 860px); }
    .money-tight { letter-spacing:-.035em; }
    .product-title { overflow-wrap:anywhere; word-break:normal; }
    .status-dot::before { content:'•'; margin-right:4px; }
    @media (min-width:768px) {
      .safe-bottom { padding-bottom:24px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
